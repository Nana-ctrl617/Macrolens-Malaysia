name: Update MacroLens dashboard

on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macrolens-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pip install -r pipeline/requirements.txt
      - run: pytest -q pipeline/tests
      - run: python pipeline/macrolens.py
      # Validate the newly generated artifact here: GITHUB_TOKEN pushes do not
      # trigger the separate push verification workflow.
      - name: Validate generated dashboard before committing
        run: node scripts/validate-published.mjs
      - name: Commit validated changes
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- data/published data/vintages)" ]; then
            echo "Official data are unchanged."
            exit 0
          fi
          git config user.name "macrolens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/published data/vintages
          if git diff --cached --quiet -- data/published data/vintages; then
            echo "There are no staged dashboard changes."
            exit 0
          fi
          git commit -m "data: refresh dashboard $(date -u +%F)"
          git push

