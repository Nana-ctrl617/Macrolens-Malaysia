name: Update MacroLens dashboard

on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macrolens-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.19.0"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pip install -r pipeline/requirements.txt
      - run: pytest -q pipeline/tests
      - run: python pipeline/macrolens.py
      # The Python generator and JSON validator protect source structure. Run
      # the dashboard application's contract suite as well, so the freshly
      # generated artifact cannot be committed if the UI would reject or
      # misinterpret a cross-field relationship.
      - name: Verify generated dashboard against application contracts
        run: pnpm run test:unit
      # Validate the newly generated artifact here: GITHUB_TOKEN pushes do not
      # trigger the separate push verification workflow.
      - name: Validate generated dashboard before committing
        id: validation
        run: |
          node scripts/validate-published.mjs
          echo "validated=true" >> "$GITHUB_OUTPUT"
      - name: Commit validated changes
        id: commit
        shell: bash
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- data/published data/vintages data/backfill)" ]; then
            echo "No published dashboard artifacts changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "macrolens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/published data/vintages data/backfill
          if git diff --cached --quiet -- data/published data/vintages data/backfill; then
            echo "There are no staged dashboard changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh dashboard $(date -u +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Verify public dashboard reflects the validated artifact
        id: live
        if: steps.validation.outputs.validated == 'true'
        env:
          DASHBOARD_API_URL: https://macrolens-malaysia.vercel.app/api/dashboard
        run: node scripts/verify-live-dashboard.mjs
      - name: Summarize dashboard refresh
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DASHBOARD_CHANGED: ${{ steps.commit.outputs.changed }}
          DASHBOARD_VALIDATED: ${{ steps.validation.outputs.validated }}
          DASHBOARD_LIVE_VERIFIED: ${{ steps.live.outputs.verified }}
        run: node scripts/refresh-summary.mjs data/published/dashboard.json
      - name: Preserve refresh evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macrolens-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/published/dashboard.json
            data/published/regional-lens.csv
            data/published/regional-lens.json
            data/published/structural-breaks.csv
            data/published/structural-breaks.json
            data/backfill/mgs-history.json
          if-no-files-found: warn
          retention-days: 14

