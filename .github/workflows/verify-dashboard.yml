name: Verify MacroLens dashboard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macrolens-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@c336a2788d9774dccfdeb4823a5058ccc9f07453 # v4.3.0
        with:
          version: "11.19.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install locked application dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Install pinned pipeline dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Install Chromium and operating-system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate and test the exact production artifact
        run: node scripts/release-gate.mjs
      - name: Preserve release-gate evidence and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macrolens-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/
            !outputs/.release-gate-key
            playwright-report/
            test-results/
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 14
